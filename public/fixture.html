><small>TIMETRAP / LIVE BOUNDARY SANDBOX</small>
<h1>一分钟之后，<br />时钟向哪个方向走？</h1>
<div id="time"></div>
<p id="zone"></p>
<div class="row">
  <div class="box">倒计时 / 真正的定时器<br /><b id="count">120</b> 秒</div>
  <div class="box">
    时间连续性<br /><strong id="direction">等待下一次时钟变化</strong>
  </div>
</div>
<div class="box">
  <label for="date">选择一个日期</label>
  <input id="date" type="date" value="2017-09-10" /><button id="save">
    保存日期
  </button>
  <p>实际写入：<code id="saved">尚未保存</code></p>
  <p>该演示故意使用 ISO 截断，展示日期字段的常见陷阱。</p>
</div>
<script>
  let count = 120,
    last = new Date().getTime(),
    lastLocal = new Date().getHours() * 60 + new Date().getMinutes();
  function paint() {
    const d = new Date();
    document.querySelector("#time").textContent = d.toLocaleTimeString("en-GB");
    document.querySelector("#zone").textContent =
      d.toDateString() +
      " / " +
      Intl.DateTimeFormat().resolvedOptions().timeZone;
    const local = d.getHours() * 60 + d.getMinutes();
    if (local < lastLocal && d - last < 120000)
      document.querySelector("#direction").textContent = "本地时钟向后走了！";
    else if (local - lastLocal > 1 && d - last < 120000)
      document.querySelector("#direction").textContent = "本地时间跳过一段！";
    last = +d;
    lastLocal = local;
  }
  paint();
  setInterval(() => {
    count = Math.max(0, count - 1);
    document.querySelector("#count").textContent = count;
    paint();
  }, 1000);
  document.querySelector("#save").onclick = () => {
    const [y, m, d] = document
      .querySelector("#date")
      .value.split("-")
      .map(Number);
    document.querySelector("#saved").textContent = new Date(y, m - 1, d)
      .toISOString()
      .slice(0, 10);
  };
</script>
